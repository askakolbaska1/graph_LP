random_seed: 42

model_type: "multi_distmult"

data_params:
  node_types: ['AA', 'DNA', 'RNA', 'SmallMolecule']
  dicts_folder: 'data/dicts/dicts_for_mdm'
  nodes_folder: 'data/nodes/nodes_for_mdm'
  edges: 'data/edges/clean_edges_without_NaNm.csv'
  heads_col: 'id_entity_1'
  predicates_col: 'predicate'
  tails_col: 'id_entity_2'
  train_size: 0.8
  val_size: 0.1
  test_size: 0.1
  device: 'cuda'

model_params:
  hidden_channels: 128

train_params:
  margin: 1
  batch_size: 4096
  epochs: 10
  lr: 0.001

test_params:
  batch_size: 128
  k_list: [1, 5, 10, 50]
  N_val: 20000